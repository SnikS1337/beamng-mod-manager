[workspace]
resolver = "3"
members = [
  "src-tauri",
  "crates/bmm-domain",
  "crates/bmm-game",
  "crates/bmm-packs",
  "crates/bmm-sources",
  "crates/bmm-checks",
  "crates/bmm-app-release",
]

[workspace.package]
version = "1.0.5"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
regex = "1"
fancy-regex = "0.20.0"
unicode-normalization = "0.1"
json5 = "1.3.3"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls", "system-proxy", "cookies", "gzip"] }
encoding_rs = "0.8"
html-escape = "0.3.0"
# Нужен только список процессов: остальные подсистемы Windows не опрашиваем.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# Моды встречаются с deflate и store. Остальные методы ZIP не читаем и не пишем:
# это убирает zstd/bzip2/lzma/ppmd/xz/aes и их сборку из C.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "time"] }
sha2 = "0.11.1"
base64 = "0.23.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# TypeScript-типы DTO генерируются из Rust: поля не разъедутся с окном.
ts-rs = "12.0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Картинки в отладочной сборке декодируются в десятки раз медленнее; при проверке на живых
# модах это выглядело бы как тормоза, которых в выпуске нет.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.png]
opt-level = 3
