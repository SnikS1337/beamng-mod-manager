[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/bmm-domain",
  "crates/bmm-game",
  "crates/bmm-packs",
  "crates/bmm-sources",
  "crates/bmm-checks",
  "crates/bmm-app-release",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
