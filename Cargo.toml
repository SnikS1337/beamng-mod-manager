[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/bmm-domain",
  "crates/bmm-game",
  "crates/bmm-packs",
  "crates/bmm-sources",
  "crates/bmm-checks",
  "crates/bmm-app-release",
]

[workspace.package]
version = "1.0.3"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
regex = "1"
fancy-regex = "0.14"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "http2", "native-tls", "charset", "cookies", "gzip", "brotli", "deflate"] }
encoding_rs = "0.8"
html-escape = "0.2"
sysinfo = "0.39"
zip = "9"
sha2 = "0.10"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Картинки в отладочной сборке декодируются в десятки раз медленнее; при проверке на живых
# модах это выглядело бы как тормоза, которых в выпуске нет.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.png]
opt-level = 3
