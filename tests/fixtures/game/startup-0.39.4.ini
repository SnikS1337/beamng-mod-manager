[filesystem]
; Location of the user folder. Syntax:
;   UserPath = <empty>           this setting will be ignored
;   UserPath = <relative path>   will use a path relative to the folder containing this .INI file
;   UserPath = <absolute path>   will use the specified path
;
; Examples:
;   UserPath =                   this setting will be ignored
;   UserPath = BeamNG.drive      make BeamNG.tech share the same user folder as BeamNG.drive
;   UserPath = D:\BeamNG.drive   use an arbitrary location in your computer
;   UserPath = .\                intended only for development builds (in some situations, this would be equivalent to -nouserpath commandline arguments). avoid if you're a regular user or a modder
;
; CAUTION: If you're a regular user or a modder, please do not edit this file by hand. Instead, use the BeamNG launcher when possible
;
;UserPath = .\
UserPath =
