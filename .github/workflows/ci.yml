name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Кэш Rust
        uses: Swatinem/rust-cache@v2

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Зависимости фронтенда
        run: npm ci

      - name: Проверка типов
        run: npm run check

      - name: Тесты фронтенда
        run: npm test

      - name: Сборка фронтенда
        run: npm run build

      - name: Форматирование Rust
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Тесты Rust
        run: cargo test --workspace --all-targets

      # Release-сборка с LTO — самая долгая часть. В рабочих ветках она не нужна:
      # код уже проверен clippy и тестами. На main собираем всегда — основная ветка
      # должна давать рабочий exe; ручной запуск проверяет сборку в любой ветке.
      - name: Сборка окна
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: npm run tauri build -- --no-bundle

      - name: Exe в артефакты
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: BeamModManager-${{ github.sha }}
          path: target/release/BeamModManager.exe
          if-no-files-found: error
          retention-days: 14
