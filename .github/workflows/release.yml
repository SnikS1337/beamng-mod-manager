name: release

# Только по тегу v*. Ручной запуск убран: с ветки версия бралась из имени ветки,
# и проверка манифестов падала.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Тег сбоку (не на main) не должен выпускать релиз.
      - name: Тег стоит на main
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Тег $env:GITHUB_REF_NAME не на main — выпуск только из main." }

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Кэш Rust
        uses: Swatinem/rust-cache@v2

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Версия совпадает с тегом
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace '^v', ''
          if (-not (Select-String -Path Cargo.toml -Pattern "version = `"$version`"" -Quiet)) {
            throw "В Cargo.toml нет версии $version — поднимите версию перед тегом."
          }
          if (-not (Select-String -Path src-tauri/tauri.conf.json -Pattern "`"version`": `"$version`"" -Quiet)) {
            throw "В tauri.conf.json нет версии $version."
          }
          if (-not (Select-String -Path package.json -Pattern "`"version`": `"$version`"" -Quiet)) {
            throw "В package.json нет версии $version."
          }

      - name: Тесты перед выпуском
        run: |
          npm test
          cargo test --workspace --all-targets --locked

      - name: Заметки из CHANGES.md
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace '^v', ''
          $text = Get-Content CHANGES.md -Raw -Encoding utf8
          $pattern = "(?ms)^## $([regex]::Escape($version))[ \t]*\r?\n(.*?)(?=^## |\z)"
          if ($text -notmatch $pattern) { throw "В CHANGES.md нет раздела ## $version" }
          $notes = $Matches[1].Trim()
          if (-not $notes) { throw "Раздел ## $version в CHANGES.md пуст" }
          Set-Content -Path notes.md -Value $notes -Encoding utf8NoBOM

      - name: Сборка окна
        run: npm run tauri build -- --no-bundle -- --locked

      - name: Портативный архив и latest.json
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace '^v', ''
          $exe = "target/release/BeamModManager.exe"
          $zip = "BeamModManager-$version.zip"
          if (-not (Test-Path $exe)) { throw "Нет $exe" }
          Compress-Archive -Path $exe -DestinationPath $zip -Force
          $size = (Get-Item $zip).Length
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$zip"
          $notes = (Get-Content notes.md -Raw -Encoding utf8).Trim()
          $manifest = [ordered]@{
            version = $version
            url = $url
            size = $size
            sha256 = $sha
            notes = $notes
            published = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          } | ConvertTo-Json
          Set-Content -Path latest.json -Value $manifest -Encoding utf8NoBOM

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            BeamModManager-*.zip
            latest.json
            notes.md
          if-no-files-found: error
          retention-days: 1

  # Право писать в репозиторий — только у шага публикации, а не у сборки с
  # зависимостями из npm и crates.io.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release

      - name: Публикация
        uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: |
            BeamModManager-*.zip
            latest.json
          fail_on_unmatched_files: true
