name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Кэш Rust
        uses: Swatinem/rust-cache@v2

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Версия совпадает с тегом
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace '^v', ''
          if (-not (Select-String -Path Cargo.toml -Pattern "version = `"$version`"" -Quiet)) {
            throw "В Cargo.toml нет версии $version — поднимите версию перед тегом."
          }
          if (-not (Select-String -Path src-tauri/tauri.conf.json -Pattern "`"version`": `"$version`"" -Quiet)) {
            throw "В tauri.conf.json нет версии $version."
          }

      - name: Сборка окна
        run: npm run tauri build -- --no-bundle

      - name: Портативный архив и latest.json
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace '^v', ''
          $exe = "target/release/BeamModManager.exe"
          $zip = "BeamModManager-$version.zip"
          if (-not (Test-Path $exe)) { throw "Нет $exe" }
          Compress-Archive -Path $exe -DestinationPath $zip -Force
          $size = (Get-Item $zip).Length
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$zip"
          $notes = "Обновление $version"
          $manifest = [ordered]@{
            version = $version
            url = $url
            size = $size
            sha256 = $sha
            notes = $notes
            published = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          } | ConvertTo-Json
          Set-Content -Path latest.json -Value $manifest -Encoding utf8NoBOM

      - name: Публикация
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            BeamModManager-*.zip
            latest.json
          fail_on_unmatched_files: true
