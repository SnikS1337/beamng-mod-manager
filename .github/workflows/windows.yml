name: windows

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия выпуска (например 0.3). Пусто — следующая после последней: 0.2 → 0.2.1'
        required: false
        default: ''

# Права по умолчанию — только чтение; писать могут лишь задания, которым это нужно (снимки, журнал, выпуск).
permissions:
  contents: read

# Новый push отменяет ещё идущую проверку прошлого: её результат уже никому не нужен. Выпуск (пометка [release] или
# «Run workflow») в общую группу не входит и не отменяется никогда.
concurrency:
  group: ci-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release')) && github.sha || 'push' }}
  cancel-in-progress: true

jobs:
  # Ядро и логика экранов: те же тесты, что и на Linux, но на настоящей Windows.
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      # пакеты NuGet и пакеты среды для self-contained сборки не качаются заново на каждой проверке
      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'global.json', 'NuGet.config') }}
          restore-keys: nuget-${{ runner.os }}-
      # упавшие проверки — пометками (их видно через API и на странице сборки, без скачивания журнала)
      - name: Тесты
        shell: pwsh
        run: |
          dotnet run --project tests/BeamModManager.Core.Tests -c Release 2>&1 | Tee-Object tests.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path tests.log -Pattern '^\s*FAIL\s' -Context 0,2 | Select-Object -First 20 | ForEach-Object {
              "::error::$($_.Line.Trim()) | $(($_.Context.PostContext | ForEach-Object { $_.Trim() }) -join ' | ')"
            }
            Select-String -Path tests.log -Pattern ' error ' | Select-Object -First 10 | ForEach-Object { "::error::$($_.Line.Trim())" }
            exit 1
          }
      # Что умеет tar этой Windows: 7z (LZMA) — им программа распаковывает 7z и RAR (TarExtractor). Только сведения: пометка
      - name: tar и 7z
        shell: pwsh
        continue-on-error: true
        run: |
          $w = Join-Path $env:RUNNER_TEMP 'tar7z'
          New-Item -ItemType Directory "$w/src/vehicles/car" -Force | Out-Null
          Set-Content "$w/src/vehicles/car/info.json" '{"Name":"Car"}'
          $sz = "${env:ProgramFiles}\7-Zip\7z.exe"
          if (-not (Test-Path $sz)) { "::notice::7-Zip на машине нет — проверка tar пропущена"; exit 0 }
          & $sz a -t7z "$w/mod.7z" "$w/src/*" | Out-Null
          New-Item -ItemType Directory "$w/out" -Force | Out-Null
          $out = & "$env:SystemRoot\System32\tar.exe" -xf "$w/mod.7z" -C "$w/out" 2>&1
          $ver = (& "$env:SystemRoot\System32\tar.exe" --version) -join ' '
          if (Test-Path "$w/out/vehicles/car/info.json") { "::notice::tar распаковал 7z (LZMA): $ver" } else { "::warning::tar не распаковал 7z: $out | $ver" }

  # Помощник внутри игры (Lua) на подделке API BeamNG: в игре LuaJIT, совместимый с Lua 5.1.
  lua:
    # версия Ubuntu закреплена: ubuntu-latest с 2026-10-19 переезжает на 26, пакет lua5.1 там может пропасть
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get install -y -q lua5.1 && lua5.1 tests/lua/bridge_test.lua src/BeamModManager.Core/Game/Bridge

  # Окно на WPF (.NET 10): сборка на каждый push, снимки экрана в демо-режиме — только когда менялся интерфейс.
  # Снимки уходят в ветку ci-shots.
  app:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # нужна история, чтобы сравнить с прошлым push
      # Снимки (≈4 мин) — только когда менялось то, что видно: окно (App), логика экранов (Ui), демо-данные; или по пометке
      # [shots]. Выпуск снимков не делает (решено 2026-10-18): он выходит из уже проверенного коммита. Изменения ядра, тестов,
      # документов и самой сборки — без снимков (новый снимок в списке — коммит с [shots]).
      - name: Нужны ли снимки
        id: need
        shell: pwsh
        env:
          BEFORE: ${{ github.event.before }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          # «Run workflow» — это выпуск: без снимков. Push: [shots] или первый push ветки — со снимками, иначе по изменениям
          $run = $env:GITHUB_EVENT_NAME -eq 'push'
          if ($run -and $env:MSG -notmatch '\[shots\]' -and $env:BEFORE -notmatch '^0+$') {
            $files = git diff --name-only $env:BEFORE $env:GITHUB_SHA 2>$null
            if ($LASTEXITCODE -eq 0) {
              $ui = @($files | Where-Object { $_ -match '^(src/BeamModManager\.(App|Ui)/|design/demo/)' })
              $run = $ui.Count -gt 0
              Write-Host "изменено файлов: $(@($files).Count), из них видимых: $($ui.Count)"
            }
          }
          $global:LASTEXITCODE = 0
          Write-Host "снимки: $run"
          "run=$($run.ToString().ToLowerInvariant())" | Out-File -Append $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      # пакеты NuGet и пакеты среды для self-contained сборки не качаются заново на каждой проверке
      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'global.json', 'NuGet.config') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Сборка
        shell: pwsh
        run: |
          New-Item -ItemType Directory shots -Force | Out-Null
          dotnet build src/BeamModManager.App -c Release -warnaserror -nologo -clp:NoSummary 2>&1 | Tee-Object shots/build.log
          if ($LASTEXITCODE -ne 0) { throw "сборка не прошла" }
      # собранный шейдер стекла уходит в ci-shots вместе со снимками, оттуда его можно взять в репозиторий
      - name: Шейдер в снимки
        shell: pwsh
        run: |
          $ps = "src/BeamModManager.App/Shaders/Glass.ps"
          if (-not (Test-Path $ps)) { throw "${ps}: файла нет после сборки" }
          Copy-Item $ps shots/Glass.ps
          "Glass.ps: $((Get-Item shots/Glass.ps).Length) байт"
      - name: Снимки экрана
        if: steps.need.outputs.run == 'true'
        shell: pwsh
        run: |
          $exe = "src/BeamModManager.App/bin/Release/net10.0-windows/BeamModManager.exe"
          New-Item -ItemType Directory shots -Force | Out-Null
          function Shot($name, [string[]]$extra) {
            $a = @('--demo', 'design/demo', '--shot', "shots/$name.png") + $extra
            $p = Start-Process $exe -ArgumentList $a -PassThru
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "${name}: окно не закрылось за 2 минуты" }
            if (-not (Test-Path "shots/$name.png")) { throw "${name}: снимка нет (код выхода $($p.ExitCode))" }
          }
          Shot 'garage' @('--select', '"Dacia Sandero Stepway"')
          Shot 'garage-empty-panel' @()
          Shot 'garage-1360' @('--width', '1360', '--select', '"Ford Mustang Shelby GT500"')
          Shot 'garage-1100' @('--width', '1100', '--height', '760')
          Shot 'garage-1000-open' @('--width', '1000', '--height', '700', '--select', '"Заправка Diesel"')
          Shot 'garage-1000' @('--width', '1000', '--height', '700')
          Shot 'garage-1000-search' @('--width', '1000', '--height', '700', '--search', 'ford')
          Shot 'garage-1920' @('--width', '1920', '--height', '1040', '--select', '"Ford Mustang Shelby GT500"')
          # правая панель целиком: «Внутри архива» и «Прошлые версии» (высокое окно, чтобы всё вошло без прокрутки)
          Shot 'garage-panel' @('--height', '1500', '--select', '"Honda Civic EK9"')
          # совместимость: мод для 0.36 при игре 0.39 — «Для игры» янтарным
          Shot 'garage-compat' @('--height', '1200', '--select', '"Kenworth T610 с цистерной"')
          # фильтр «Удалённые»: серые карточки, справа «Вернуть»
          Shot 'garage-deleted' @('--filter', 'Deleted', '--select', '"BMW M3 E30"')
          # плашка обновления программы: загрузка, проверка и распаковка, готово (отсчёт), сбой; светлая загрузка
          Shot 'update-downloading' @('--update', 'downloading', '--width', '1360')
          Shot 'update-verifying' @('--update', 'verifying', '--width', '1360')
          Shot 'update-ready' @('--update', 'ready', '--width', '1360')
          Shot 'update-failed' @('--update', 'failed', '--width', '1360')
          Shot 'light-update-downloading' @('--mode', 'Light', '--update', 'downloading', '--width', '1360')
          # установка из архива: окно проверки (обновление; пак из трёх: новый, с кодом, уже стоит; не мод), светлое — новый
          # из RAR с перепаковкой; плашка «Скачан мод»; подсказка при перетаскивании
          Shot 'incoming-update' @('--incoming', 'civic_update.zip')
          Shot 'incoming-several' @('--incoming', 'jdm_several.7z')
          Shot 'incoming-problem' @('--incoming', 'photos_problem.zip', '--width', '1100', '--height', '760')
          Shot 'light-incoming-new' @('--mode', 'Light', '--incoming', '"Lancer Evo IX.rar"')
          Shot 'incoming-offer' @('--offer', 'civic_update.zip', '--width', '1360')
          Shot 'drop-hint' @('--drop-hint')
          Shot 'slow-offer' @('--slow-offer', '--width', '1360')
          # знакомство при первом запуске: четыре шага (светлое — третий)
          Shot 'tour-1' @('--tour', '1')
          Shot 'tour-2' @('--tour', '2')
          Shot 'light-tour-3' @('--mode', 'Light', '--tour', '3')
          Shot 'tour-4' @('--tour', '4', '--width', '1100', '--height', '760')
          Shot 'settings-downloads' @('--page', 'settings', '--section', 'Downloads', '--allow-downloads')
          # тост «выключен» с «Отменить» и полосой «сколько осталось» (тёмное и светлое)
          Shot 'garage-toast' @('--select', '"Dacia Sandero Stepway"', '--toggle')
          Shot 'light-garage-toast' @('--mode', 'Light', '--select', '"Dacia Sandero Stepway"', '--toggle')
          Shot 'garage-deep' @('--theme', 'Deep', '--select', '"Dacia Sandero Stepway"')
          Shot 'garage-forest' @('--theme', 'Forest')
          Shot 'light-garage-graphite' @('--mode', 'Light', '--theme', 'Graphite')
          Shot 'garage-dusk' @('--theme', 'Dusk')
          Shot 'settings' @('--page', 'settings')
          Shot 'light-garage' @('--mode', 'Light', '--select', '"Dacia Sandero Stepway"')
          # масштаб 200 % (виртуалка на Mac): края островка и капсулы, кольца фона; узкое окно — островок слева, как на видео
          Shot 'light-x2' @('--mode', 'Light', '--theme', 'Dusk', '--width', '1215', '--height', '700', '--scale', '2')
          Shot 'dark-x2' @('--width', '1215', '--height', '700', '--scale', '2')
          Shot 'light-drops-x2' @('--mode', 'Light', '--theme', 'Dusk', '--width', '1215', '--height', '700', '--scale', '2', '--drop-motion')
          Shot 'drops' @('--drop-motion')
          Shot 'light-deep' @('--mode', 'Light', '--theme', 'Deep')
          Shot 'light-dusk' @('--mode', 'Light', '--theme', 'Dusk', '--width', '1100', '--height', '760')
          Shot 'light-settings' @('--mode', 'Light', '--page', 'settings')
          Shot 'light-settings-updates' @('--mode', 'Light', '--page', 'settings', '--section', 'Updates')
          Shot 'settings-folders' @('--page', 'settings', '--section', 'Folders')
          Shot 'settings-updates' @('--page', 'settings', '--section', 'Updates')
          Shot 'settings-sites' @('--page', 'settings', '--section', 'Sites', '--width', '1100', '--height', '760')
          Shot 'settings-1000' @('--page', 'settings', '--width', '1000', '--height', '700')
          Shot 'updates' @('--page', 'updates')
          Shot 'updates-missing' @('--page', 'updates', '--filter', 'Missing', '--width', '1360')
          Shot 'updates-1000' @('--page', 'updates', '--width', '1000', '--height', '700')
          Shot 'light-updates' @('--mode', 'Light', '--page', 'updates')
          # верх «островки»: раскрытый поиск, сжатый заголовок при прокрутке, светлое, без жидкого стекла
          Shot 'garage-search' @('--search', 'ford')
          Shot 'garage-scrolled' @('--scroll', '400')
          # светлое стекло над фото: тёмный текст островка должен читаться (подъём тёмного в шейдере)
          Shot 'light-garage-scrolled' @('--mode', 'Light', '--scroll', '400')
          Shot 'light-garage-search' @('--mode', 'Light', '--search', 'ford', '--scroll', '400')
          Shot 'matte-garage' @('--matte', '--select', '"Dacia Sandero Stepway"', '--scroll', '300')
          Shot 'updates-search' @('--page', 'updates', '--search', 'dacia', '--width', '1100', '--height', '760')
          # «Поиск»: до запроса, с результатами (одна карточка на мод, «возможно, тот же мод», платный), узкое окно, светлое
          Shot 'search-empty' @('--page', 'search')
          Shot 'search' @('--page', 'search', '--search', 'lamborghini')
          Shot 'search-1000' @('--page', 'search', '--search', 'lamborghini', '--width', '1000', '--height', '700')
          Shot 'light-search' @('--mode', 'Light', '--page', 'search', '--search', 'lamborghini')
          Shot 'bind' @('--page', 'bind')
          Shot 'light-bind' @('--mode', 'Light', '--page', 'bind', '--width', '1100', '--height', '760')
          # большая библиотека: замеры в shots/*.perf.txt (запуск, фильтр, поиск, перечитывание, память)
          Shot 'many-1000' @('--many', '1000', '--perf')
          Shot 'many-5000' @('--many', '5000', '--perf')
          # долгая работа: 300 кругов фильтров, поиска, перечитывания, переключений и разделов; память до и после
          Shot 'soak' @('--many', '300', '--perf', '--soak')
          # кадры в секунду в анимациях (выезд панели, капли, наведение, переход в настройки): shots/frames.png.frames.txt
          Shot 'frames' @('--frames')
          Get-ChildItem shots -Filter *.perf.txt | ForEach-Object { Write-Host "── $($_.Name)"; Get-Content $_.FullName }
          Get-ChildItem shots -Filter *.frames.txt | ForEach-Object { Write-Host "── $($_.Name)"; Get-Content $_.FullName }
          # пороги с запасом (на этой машине нет видеокарты): регресс сетки или сверки ловится здесь, а не у человека
          function Ms($file, $what) {
            $line = Get-Content "shots/$file" | Where-Object { $_.StartsWith($what) } | Select-Object -First 1
            if (-not $line) { throw "${file}: нет строки «$what»" }
            [int]($line -replace '.*: (\d+) мс.*', '$1')
          }
          $start = Ms 'many-5000.png.perf.txt' 'запуск до готовности'
          $reset = Ms 'many-5000.png.perf.txt' 'поиск сброшен'
          if ($start -gt 8000) { throw "5000 модов: запуск $start мс (порог 8000)" }
          if ($reset -gt 1500) { throw "5000 модов: сброс поиска $reset мс (порог 1500)" }
          $upd = Ms 'many-5000.png.perf.txt' 'раздел «Обновления»'
          if ($upd -gt 1500) { throw "5000 модов: раздел «Обновления» $upd мс (порог 1500)" }
          Get-ChildItem shots
      # без снимков ветку не трогаем: иначе прошлые снимки затёрлись бы одним журналом сборки
      - name: Отправить снимки
        if: always() && (steps.need.outputs.run == 'true' || failure())
        shell: pwsh
        run: |
          if (-not (Test-Path shots)) { exit 0 }
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-shots-tmp
          git rm -r -q --cached .
          git add -f shots
          git commit -q -m "Снимки для $env:GITHUB_SHA"
          git push -f -q origin HEAD:ci-shots

  # Самообновление целиком на настоящей Windows: две сборки как у выпуска (0.3.0 и 0.3.1: у прежней третий номер 0 — так
  # выглядели 0.2 и 0.3, которые из-за этого обновлений не искали); выпуск лежит в папке вместо
  # GitHub (BMM_TEST_UPDATE_FEED — подменяется только сеть, проверки те же). Программа — на другом диске, чем профиль
  # (D: и C:), в папке с русскими буквами и пробелами. Программа сама пишет в log.txt папки выпуска, что запустилось.
  # Долгая (две self-contained сборки), а меняется самообновление редко: идёт только перед выпуском, по «Run workflow»
  # или по пометке [selfupdate] в описании коммита. Выпуск без неё не делается (needs).
  selfupdate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release') || contains(github.event.head_commit.message, '[selfupdate]')
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      # пакеты NuGet и пакеты среды для self-contained сборки не качаются заново на каждой проверке
      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'global.json', 'NuGet.config') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Две сборки как у выпуска
        shell: pwsh
        run: |
          foreach ($v in '0.3.0', '0.3.1') {
            dotnet publish src/BeamModManager.App -c Release -r win-x64 --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
              -p:DebugType=none -p:Version=$v -p:SelfTestBuild=true -nologo -o "pub-$v"
            if ($LASTEXITCODE -ne 0) { throw "publish $v не прошёл" }
          }
          $feed = Join-Path $env:RUNNER_TEMP 'feed'
          New-Item -ItemType Directory $feed -Force | Out-Null
          Copy-Item tools/release/README.txt "pub-0.3.1/Как запустить.txt"
          Compress-Archive -Path pub-0.3.1/* -DestinationPath "$feed/ModManagerBeamNG.zip" -Force
          $zip = Get-Item "$feed/ModManagerBeamNG.zip"
          [ordered]@{
            version   = '0.3.1'
            url       = 'https://github.com/SnikS1337/beamng-mod-manager/releases/download/v0.3.1/ModManagerBeamNG.zip'
            size      = $zip.Length
            sha256    = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            notes     = 'проверка'
            published = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          } | ConvertTo-Json | Out-File -Encoding utf8NoBOM "$feed/latest.json"
          Get-Content "$feed/latest.json"
      - name: Обновление, падение новой версии, нет прав
        shell: pwsh
        run: |
          $feed = Join-Path $env:RUNNER_TEMP 'feed'
          New-Item -ItemType Directory selfupdate -Force | Out-Null
          Start-Transcript -Path selfupdate/transcript.txt -Force | Out-Null
          # причина сбоя — пометкой (её видно через API), полный ход — в ветке ci-selfupdate
          trap { Write-Host "::error::$_"; Stop-Transcript | Out-Null; exit 1 }
          $app = Join-Path (Split-Path $env:GITHUB_WORKSPACE) 'Мои программы (тест)\Mod Manager BeamNG'
          $data = Join-Path $env:LOCALAPPDATA 'BeamModManager'
          Write-Host "программа: $app; профиль: $data"
          if ((Split-Path -Qualifier $app) -eq (Split-Path -Qualifier $data)) { Write-Host "::warning::программа и профиль на одном диске" }

          $script:idx = 0
          function Scenario($name, [hashtable]$envs, [string]$expectVer, [string[]]$expectLog, [scriptblock]$prepare) {
            Write-Host "── $name"
            Get-Process BeamModManager -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep 1
            if (Test-Path $app) { icacls $app /reset /T /Q | Out-Null }
            Remove-Item -Recurse -Force $app, $data, "$feed/log.txt" -ErrorAction SilentlyContinue
            New-Item -ItemType Directory $app -Force | Out-Null
            Copy-Item pub-0.3.0/BeamModManager.exe $app/
            foreach ($k in 'BMM_TEST_CRASH_VERSION', 'BMM_TEST_CRASH_HARD') { Remove-Item "env:$k" -ErrorAction SilentlyContinue }
            foreach ($k in $envs.Keys) { Set-Item "env:$k" $envs[$k] }
            $env:BMM_TEST_UPDATE_FEED = $feed
            if ($prepare) { & $prepare }
            Start-Process (Join-Path $app 'BeamModManager.exe')
            # обновление перезапускает программу 1–2 раза; ждём, пока не останется ни одного процесса
            $sw = [Diagnostics.Stopwatch]::StartNew()
            Start-Sleep 3
            while ((Get-Process BeamModManager -ErrorAction SilentlyContinue) -and $sw.Elapsed.TotalSeconds -lt 240) { Start-Sleep 1 }
            $alive = Get-Process BeamModManager -ErrorAction SilentlyContinue
            $alive | Stop-Process -Force -ErrorAction SilentlyContinue
            icacls $app /reset /T /Q | Out-Null
            $log = @(if (Test-Path "$feed/log.txt") { Get-Content "$feed/log.txt" })
            $log | ForEach-Object { Write-Host "   $_" }
            if (Test-Path "$data/errors.log") { Get-Content "$data/errors.log" -TotalCount 40 | ForEach-Object { Write-Host "   errors.log: $_" } }
            $script:idx++
            if (Test-Path "$feed/log.txt") { Copy-Item "$feed/log.txt" "selfupdate/$($script:idx)-log.txt" }
            if (Test-Path "$data/errors.log") { Copy-Item "$data/errors.log" "selfupdate/$($script:idx)-errors.log" }
            Write-Host "   в папке программы: $((Get-ChildItem $app -ErrorAction SilentlyContinue | ForEach-Object Name) -join ', ')"
            if ($alive) { throw "${name}: программа не закрылась за 4 минуты" }
            $fv = (Get-Item (Join-Path $app 'BeamModManager.exe')).VersionInfo.FileVersion
            if (-not $fv.StartsWith($expectVer)) { throw "${name}: на месте версия $fv, ждали $expectVer" }
            $joined = $log -join "`n"
            foreach ($p in $expectLog) { if ($joined -notmatch $p) { throw "${name}: в журнале нет «$p»" } }
            # прежняя версия после подмены не должна падать на выходе (настройки сохраняются до подмены)
            if ((Test-Path "$data/errors.log") -and (Select-String -Path "$data/errors.log" -Pattern 'FileNotFoundException|TypeInitializationException' -Quiet)) {
              throw "${name}: в errors.log ошибка загрузки сборки"
            }
            $left = @(Get-ChildItem $app | ForEach-Object Name)
            if ($left.Count -ne 1) { throw "${name}: в папке программы лишнее: $($left -join ', ')" }
            Write-Host "   ок: $fv"
          }

          Scenario 'обычное обновление' @{} '0.3.1.0' @(
            'start 0\.3 normal', 'check Available', 'install ReadyToRestart',
            'start 0\.3\.1 after-update old=False new=False bad=False', 'check UpToDate')
          Scenario 'новая версия падает при запуске: возвращает прежнюю сама' @{ BMM_TEST_CRASH_VERSION = '0.3.1' } '0.3.0.0' @(
            'install ReadyToRestart', 'start 0\.3 rolled-back old=False new=False bad=False skip=0\.3\.1',
            'check UpToDate версия 0\.3\.1 не запустилась')
          Scenario 'новая версия умирает сама: прежнюю возвращает прежний процесс' @{ BMM_TEST_CRASH_VERSION = '0.3.1'; BMM_TEST_CRASH_HARD = '1' } '0.3.0.0' @(
            'install ReadyToRestart', 'start 0\.3 rolled-back .*skip=0\.3\.1', 'check UpToDate')
          Scenario 'нет прав на папку программы: ничего не тронуто' @{} '0.3.0.0' @(
            'check Available', 'install Available нет прав') {
            # только сама папка: нельзя добавлять файлы и удалять из неё (запуск exe при этом разрешён)
            icacls $app /deny "${env:USERNAME}:(WD,AD,DC)" /Q | Out-Null
          }
          Stop-Transcript | Out-Null
      - name: Журнал в ветку ci-selfupdate
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path selfupdate)) { exit 0 }
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-selfupdate-tmp
          git rm -r -q --cached .
          git add -f selfupdate
          git commit -q -m "Самообновление для $env:GITHUB_SHA"
          git push -f -q origin HEAD:ci-selfupdate

  # Готовая программа: один exe без установки .NET (self-contained). Только по команде: пометка [release] в описании
  # коммита или «Run workflow» на странице Actions. Обычные изменения выпусков не создают (решено 2026-10-15).
  # Выпуски — в этом репозитории (с 2026-10-17, он открыт): v<версия> с ModManagerBeamNG.zip и latest.json, оттуда
  # программа обновляется сама. Версия (решено 2026-10-17, с 0.2): [release 0.3] — такая; просто [release] — следующая
  # после последней (0.2 → 0.2.1). Старее или равной последней не выйдет.
  release:
    needs: [build, app, lua, selfupdate]
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release')
    runs-on: windows-2025
    timeout-minutes: 20
    # выпуски по одному: более старая сборка, закончившая позже, не должна стать «последней»
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # до 0.2 выпуски для самообновления лежали в SnikS1337/ModManagerBeamNG: туда уходит один «мост» (см. ниже)
      OLD_REPO: SnikS1337/ModManagerBeamNG
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'global.json', 'NuGet.config') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Версия
        shell: pwsh
        env:
          MSG: ${{ github.event.head_commit.message }}
          ASKED: ${{ github.event.inputs.version }}
        run: |
          function Norm([version]$v) { [version]::new($v.Major, [math]::Max(0, $v.Minor), [math]::Max(0, $v.Build)) }
          # «0.2.0» показываем как «0.2»: без хвостового нуля
          function Show([version]$v) { if ($v.Build -gt 0) { "$($v.Major).$($v.Minor).$($v.Build)" } else { "$($v.Major).$($v.Minor)" } }
          $asked = $env:ASKED
          if (-not $asked) {
            $m = [regex]::Match("$env:MSG", '\[release(?:\s+v?(\d+\.\d+(?:\.\d+)?))?\]')
            if ($m.Groups[1].Success) { $asked = $m.Groups[1].Value }
          }
          if ($asked -and $asked -notmatch '^v?\d+\.\d+(\.\d+)?$') { throw "версия «$asked»: нужно вида 0.3 или 0.3.1" }
          # последняя опубликованная (без «пре-выпусков»)
          $cur = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName 2>&1
          if ($LASTEXITCODE -ne 0) {
            if ("$cur" -notmatch 'release not found') { throw "не удалось прочитать выпуски: $cur" }
            $cur = $null
          }
          $global:LASTEXITCODE = 0
          $curV = if ($cur) { Norm ([version]($cur.TrimStart('v'))) } else { $null }
          if ($asked) { $v = Norm ([version]($asked.TrimStart('v'))) }
          elseif ($curV) { $v = [version]::new($curV.Major, $curV.Minor, $curV.Build + 1) }
          else { throw "выпусков ещё нет: укажите версию — [release 0.2] в описании коммита или поле версии в «Run workflow»" }
          if ($curV -and $v -le $curV) { throw "версия $(Show $v) не новее последней ($(Show $curV))" }
          $show = Show $v
          Write-Host "последняя: $(if ($curV) { Show $curV } else { 'нет' }); выпускаем: $show"
          "VER=$($v.ToString(3))" | Out-File -Append $env:GITHUB_ENV
          "SHOW=$show" | Out-File -Append $env:GITHUB_ENV
      - name: Сборка exe
        shell: pwsh
        run: |
          dotnet publish src/BeamModManager.App -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none -p:Version=$env:VER -nologo -o publish
          if ($LASTEXITCODE -ne 0) { throw "publish не прошёл" }
          $fv = (Get-Item publish/BeamModManager.exe).VersionInfo.FileVersion
          if ([version]$fv -ne [version]"$env:VER.0") { throw "версия exe ($fv) не совпала с $env:VER, самообновление её бы отвергло" }
          Copy-Item tools/release/README.txt "publish/Как запустить.txt"
          Compress-Archive -Path publish/* -DestinationPath "ModManagerBeamNG.zip"
          $zip = Get-Item ModManagerBeamNG.zip
          [ordered]@{
            version   = $env:SHOW
            url       = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:SHOW/ModManagerBeamNG.zip"
            size      = $zip.Length
            sha256    = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            notes     = (git log -1 --pretty=%s)
            published = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          } | ConvertTo-Json | Out-File -Encoding utf8NoBOM latest.json
          Get-Content latest.json
      - name: Выпуск
        shell: pwsh
        run: |
          $msg = (git log -1 --pretty=%s)
          $notes = "$msg`n`nСкачать ModManagerBeamNG.zip, распаковать в любую папку, запустить BeamModManager.exe. Подробности — в «Как запустить.txt» внутри архива. Уже установленная программа обновится сама."
          gh release create "v$env:SHOW" ModManagerBeamNG.zip latest.json --title "ModManager BeamNG $env:SHOW" --notes $notes --target $env:GITHUB_SHA --latest
          if ($LASTEXITCODE -ne 0) { throw "выпуск не создан" }
          # плавающий «latest» (свежая сборка до 0.2) больше не ведём: выпуски теперь с версиями
          gh release delete latest --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
      # «Мост» для программ до 0.2: они спрашивают обновления в SnikS1337/ModManagerBeamNG. Туда один раз уходит этот же
      # выпуск; в нём новая программа, которая дальше обновляется уже отсюда. Как только там есть 0.2 или новее, шаг
      # ничего не делает. Нужен секрет RELEASES_TOKEN (запись в тот репозиторий).
      - name: Мост для программ до 0.2
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { Write-Host "::warning::RELEASES_TOKEN не задан: программы до 0.2 не узнают о новой версии"; exit 0 }
          $cur = gh release view --repo $env:OLD_REPO --json tagName --jq .tagName 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::не удалось прочитать выпуски $env:OLD_REPO: $cur"; exit 1 }
          $global:LASTEXITCODE = 0
          if ([version]($cur.TrimStart('v')) -ge [version]'0.2') { Write-Host "мост уже стоит ($cur), старый репозиторий не трогаем"; exit 0 }
          $msg = (git log -1 --pretty=%s)
          $out = gh release create "v$env:SHOW" ModManagerBeamNG.zip latest.json --repo $env:OLD_REPO --title "ModManager BeamNG $env:SHOW" `
            --notes "$msg`n`nПоследний выпуск здесь: дальше программа обновляется из SnikS1337/beamng-mod-manager." --latest 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::мост не создан: $out"; exit 1 }
          Write-Host "::notice::мост: $out"
