name: windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Ядро и логика экранов: те же тесты, что и на Linux, но на настоящей Windows.
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Тесты
        run: dotnet run --project tests/BeamModManager.Core.Tests -c Release

  # Помощник внутри игры (Lua) на подделке API BeamNG: в игре LuaJIT, совместимый с Lua 5.1.
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q lua5.1 && lua5.1 tests/lua/bridge_test.lua src/BeamModManager.Core/Game/Bridge

  # Окно на WPF (.NET 10): сборка и снимки экрана в демо-режиме. Снимки уходят в ветку ci-shots.
  app:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Сборка
        shell: pwsh
        run: |
          New-Item -ItemType Directory shots -Force | Out-Null
          dotnet build src/BeamModManager.App -c Release -warnaserror -nologo -clp:NoSummary 2>&1 | Tee-Object shots/build.log
          if ($LASTEXITCODE -ne 0) { throw "сборка не прошла" }
      # собранный шейдер стекла уходит в ci-shots вместе со снимками, оттуда его можно взять в репозиторий
      - name: Шейдер в снимки
        shell: pwsh
        run: |
          $ps = "src/BeamModManager.App/Shaders/Glass.ps"
          if (-not (Test-Path $ps)) { throw "${ps}: файла нет после сборки" }
          Copy-Item $ps shots/Glass.ps
          "Glass.ps: $((Get-Item shots/Glass.ps).Length) байт"
      - name: Снимки экрана
        shell: pwsh
        run: |
          $exe = "src/BeamModManager.App/bin/Release/net10.0-windows/BeamModManager.exe"
          New-Item -ItemType Directory shots -Force | Out-Null
          function Shot($name, [string[]]$extra) {
            $a = @('--demo', 'design/demo', '--shot', "shots/$name.png") + $extra
            $p = Start-Process $exe -ArgumentList $a -PassThru
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "${name}: окно не закрылось за 2 минуты" }
            if (-not (Test-Path "shots/$name.png")) { throw "${name}: снимка нет (код выхода $($p.ExitCode))" }
          }
          Shot 'garage' @('--select', '"Dacia Sandero Stepway"')
          Shot 'garage-empty-panel' @()
          Shot 'garage-1360' @('--width', '1360', '--select', '"Ford Mustang Shelby GT500"')
          Shot 'garage-1100' @('--width', '1100', '--height', '760')
          Shot 'garage-1000-open' @('--width', '1000', '--height', '700', '--select', '"Заправка Diesel"')
          Shot 'garage-deep' @('--theme', 'Deep', '--select', '"Dacia Sandero Stepway"')
          Shot 'garage-dusk' @('--theme', 'Dusk')
          Shot 'settings' @('--page', 'settings')
          Shot 'settings-folders' @('--page', 'settings', '--section', 'Folders')
          Shot 'settings-updates' @('--page', 'settings', '--section', 'Updates')
          Shot 'settings-sites' @('--page', 'settings', '--section', 'Sites', '--width', '1100', '--height', '760')
          Shot 'settings-1000' @('--page', 'settings', '--width', '1000', '--height', '700')
          Get-ChildItem shots
      - name: Отправить снимки
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path shots)) { exit 0 }
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-shots-tmp
          git rm -r -q --cached .
          git add -f shots
          git commit -q -m "Снимки для $env:GITHUB_SHA"
          git push -f -q origin HEAD:ci-shots

  # Готовая программа: один exe без установки .NET (self-contained). Только по команде: пометка [release] в описании
  # коммита или «Run workflow» на странице Actions. Обычные изменения выпусков не создают (решено 2026-10-15).
  # 1) выпуск «latest» в этом (закрытом) репозитории — как раньше;
  # 2) выпуск v<версия> в публичном SnikS1337/ModManagerBeamNG c latest.json — оттуда программа обновляется сама.
  #    Нужен секрет RELEASES_TOKEN (токен с правом Contents: write на публичный репозиторий); без него шаг пропускается.
  release:
    needs: [build, app, lua]
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    # выпуски по одному: более старая сборка, закончившая позже, не должна стать «последней»
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      PUBLIC_REPO: SnikS1337/ModManagerBeamNG
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Сборка exe
        shell: pwsh
        run: |
          $ver = "0.1.$env:GITHUB_RUN_NUMBER"
          dotnet publish src/BeamModManager.App -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none -p:Version=$ver -nologo -o publish
          if ($LASTEXITCODE -ne 0) { throw "publish не прошёл" }
          $fv = (Get-Item publish/BeamModManager.exe).VersionInfo.FileVersion
          if (-not $fv.StartsWith($ver)) { throw "версия exe ($fv) не совпала с ${ver}, самообновление её бы отвергло" }
          Copy-Item tools/release/README.txt "publish/Как запустить.txt"
          Compress-Archive -Path publish/* -DestinationPath "ModManagerBeamNG.zip"
          $zip = Get-Item ModManagerBeamNG.zip
          $manifest = [ordered]@{
            version   = $ver
            url       = "https://github.com/$env:PUBLIC_REPO/releases/download/v$ver/ModManagerBeamNG.zip"
            size      = $zip.Length
            sha256    = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            notes     = (git log -1 --pretty=%s)
            published = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          }
          $manifest | ConvertTo-Json | Out-File -Encoding utf8NoBOM latest.json
          Get-Content latest.json
          "VER=$ver" | Out-File -Append $env:GITHUB_ENV
      - name: Выпуск latest (закрытый репозиторий)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msg = (git log -1 --pretty=%s)
          $notes = "Сборка $env:VER от $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC, коммит $($env:GITHUB_SHA.Substring(0,7)).`n`nПоследнее изменение: $msg`n`nСкачать ModManagerBeamNG.zip, распаковать в любую папку, запустить BeamModManager.exe. Подробности в «Как запустить.txt» внутри архива."
          gh release delete latest --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create latest ModManagerBeamNG.zip latest.json --title "ModManager BeamNG $env:VER (свежая сборка)" --notes $notes --target $env:GITHUB_SHA --prerelease
          if ($LASTEXITCODE -ne 0) { throw "выпуск не создан" }
      - name: Выпуск для самообновления (публичный репозиторий)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { Write-Host "::warning::RELEASES_TOKEN не задан: самообновление не получит эту сборку"; exit 0 }
          # не выкладываем версию старше уже опубликованной
          $cur = gh release view --repo $env:PUBLIC_REPO --json tagName --jq .tagName 2>&1
          if ($LASTEXITCODE -ne 0) {
            if ("$cur" -notmatch 'release not found') { Write-Host "::error::не удалось прочитать выпуски $env:PUBLIC_REPO: $cur"; exit 1 }
            $cur = $null
          }
          $global:LASTEXITCODE = 0
          if ($cur) {
            $curV = [version]($cur.TrimStart('v'))
            if ([version]$env:VER -le $curV) { Write-Host "::warning::уже опубликована $cur, $env:VER не новее"; exit 0 }
          }
          $msg = (git log -1 --pretty=%s)
          $out = gh release create "v$env:VER" ModManagerBeamNG.zip latest.json --repo $env:PUBLIC_REPO --title "ModManager BeamNG $env:VER" --notes "$msg" --latest 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::публичный выпуск не создан: $out"; exit 1 }
          Write-Host "::notice::опубликовано: $out"
