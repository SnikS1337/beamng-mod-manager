# Сборка и тесты на настоящей Windows (у GitHub). Запускается на каждую отправку в main и вручную.
# Результат: зелёная или красная отметка у коммита, журнал сборки и (когда появится приложение) готовая сборка для скачивания.
name: windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Тесты ядра на Windows
        run: dotnet run --project tests/BeamModManager.Core.Tests -c Release
