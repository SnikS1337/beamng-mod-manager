[package]
name = "bmm-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "bmm_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# unstable: multiwebview для окна загрузки (сайт слева, панель этапов справа)
tauri = { version = "2.12.5", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
base64.workspace = true
url.workspace = true
tokio = { version = "1.54.1", features = ["sync"] }
bmm-domain = { path = "../crates/bmm-domain" }
bmm-game = { path = "../crates/bmm-game" }
bmm-packs = { path = "../crates/bmm-packs" }
bmm-sources = { path = "../crates/bmm-sources" }
bmm-checks = { path = "../crates/bmm-checks" }
bmm-app-release = { path = "../crates/bmm-app-release" }

[dev-dependencies]
tempfile.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
